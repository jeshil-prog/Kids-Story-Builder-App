    <!-- iOS "Add to Home Screen" support — when launched from the home
         screen icon (not from within Safari), iOS runs the app with zero
         browser chrome (no URL bar, no tab switcher). This is the only way
         to get a genuinely fullscreen experience on iOS; there is no
         JavaScript API that can hide Safari's chrome within a normal tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StoryDream" />
